name: Threads 自動投稿

on:
  schedule:
    - cron: "30 21 * * *"  # 毎日 6:30 JST（平日用）
    - cron: "0 0 * * *"    # 毎日 9:00 JST（土日祝用）
  workflow_dispatch:
    inputs:
      dry_run:
        description: "テスト（実際には投稿しない）"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install requests jpholiday

      - name: 投稿
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python post.py test
          elif [ "${{ github.event.schedule }}" = "30 21 * * *" ]; then
            python post.py weekday
          else
            python post.py weekend
          fi

      - name: 投稿記録を保存
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add posts.csv
          git diff --cached --quiet || (git commit -m "投稿記録を更新" && git push)
